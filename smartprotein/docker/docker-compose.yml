# SmartProtein Reproducible Big Data Cluster (Stage 4)
# Profiles:
#   Default (core):  docker compose up -d
#   + Streaming:     docker compose --profile streaming up -d
#   + Airflow:       docker compose --profile airflow up -d
#   + 3-Node HDFS:   docker compose --profile scale3 up -d

services:
  # ==========================================================================
  # 1. HADOOP HDFS LAYER (MUST-HAVE)
  # ==========================================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: sp-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "9000:9000"   # HDFS RPC URI
    volumes:
      - sp_namenode:/hadoop/dfs/name
      - ../data/raw:/opt/smartprotein/data/raw
      - ../hive:/opt/smartprotein/hive
      - ./init_hdfs_zones.sh:/opt/smartprotein/init_hdfs_zones.sh
    env_file:
      - ./hadoop.env
    networks:
      - smartprotein-net

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sp-datanode1
    restart: unless-stopped
    depends_on:
      - namenode
    volumes:
      - sp_datanode1:/hadoop/dfs/data
    env_file:
      - ./hadoop.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    networks:
      - smartprotein-net

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sp-datanode2
    profiles: ["scale3"]
    depends_on:
      - namenode
    volumes:
      - sp_datanode2:/hadoop/dfs/data
    env_file:
      - ./hadoop.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    networks:
      - smartprotein-net

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sp-datanode3
    profiles: ["scale3"]
    depends_on:
      - namenode
    volumes:
      - sp_datanode3:/hadoop/dfs/data
    env_file:
      - ./hadoop.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    networks:
      - smartprotein-net

  # ==========================================================================
  # 2. APACHE SPARK CLUSTER (MUST-HAVE)
  # ==========================================================================
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: sp-spark-master
    depends_on:
      - namenode
      - datanode1
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"
    volumes:
      - ../spark_jobs:/opt/smartprotein/spark_jobs
      - ../config:/opt/smartprotein/config
      - ../tests:/opt/smartprotein/tests
      - ../data:/opt/smartprotein/data
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    networks:
      - smartprotein-net

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: sp-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ../spark_jobs:/opt/smartprotein/spark_jobs
      - ../config:/opt/smartprotein/config
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    networks:
      - smartprotein-net

  # ==========================================================================
  # 3. APACHE HIVE + RDBMS SOURCE FOR SQOOP (MUST-HAVE)
  # ==========================================================================
  hive-metastore-db:
    image: postgres:13-alpine
    container_name: sp-hive-metastore-db
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    volumes:
      - sp_hive_pg:/var/lib/postgresql/data
    networks:
      - smartprotein-net

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: sp-hive-metastore
    depends_on:
      - namenode
      - hive-metastore-db
    env_file:
      - ./hive.env
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    networks:
      - smartprotein-net

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: sp-hive-server
    depends_on:
      - hive-metastore
    env_file:
      - ./hive.env
    ports:
      - "10000:10000" # Beeline / JDBC port
      - "10002:10002" # HiveServer2 Web UI
    volumes:
      - ../hive:/opt/smartprotein/hive
    networks:
      - smartprotein-net

  postgres-stores:
    image: postgres:13-alpine
    container_name: sp-postgres-stores
    environment:
      - POSTGRES_DB=smartprotein_oltp
      - POSTGRES_USER=sp_user
      - POSTGRES_PASSWORD=sp_pass
    ports:
      - "5433:5432"   # Exposed on 5433 to avoid local Postgres collision
    volumes:
      - sp_oltp_pg:/var/lib/postgresql/data
    networks:
      - smartprotein-net

  # ==========================================================================
  # 4. KAFKA STREAMING SPEED LAYER (SHOULD-HAVE)
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sp-zookeeper
    profiles: ["streaming"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smartprotein-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sp-kafka
    profiles: ["streaming"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - smartprotein-net

  # ==========================================================================
  # 5. APACHE AIRFLOW ORCHESTRATION (MUST-HAVE / SHOULD-HAVE)
  # ==========================================================================
  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: sp-airflow
    profiles: ["airflow"]
    command: standalone
    ports:
      - "8085:8080"   # Airflow UI mapped to 8085 (8080 is Spark Master)
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../spark_jobs:/opt/smartprotein/spark_jobs
      - ../tests:/opt/smartprotein/tests
      - ../config:/opt/smartprotein/config
    networks:
      - smartprotein-net

volumes:
  sp_namenode:
  sp_datanode1:
  sp_datanode2:
  sp_datanode3:
  sp_hive_pg:
  sp_oltp_pg:

networks:
  smartprotein-net:
    driver: bridge

