version: "3.8"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: fitguard-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./lakehouse/fitguard/bronze:/data/bronze
      - ./spark_jobs:/opt/spark_jobs
      - ./config:/opt/config
      - ./hive:/opt/hive_ddl
    environment:
      - CLUSTER_NAME=fitguard-hdfs
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_blocksize=134217728
    networks:
      - fitguard-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: fitguard-datanode
    restart: unless-stopped
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
    networks:
      - fitguard-net

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: fitguard-spark-master
    depends_on:
      - namenode
      - datanode
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./config:/opt/config
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    networks:
      - fitguard-net

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: fitguard-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    networks:
      - fitguard-net

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  fitguard-net:
    driver: bridge

